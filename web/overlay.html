<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis</title><link rel="stylesheet" href="/static/overlay.css"><script src="/static/overlay.js" defer></script></head>
<body data-phase="idle"><section id="panel" aria-label="Assistant Jarvis">
  <header class="notch-crown">
    <div class="crown-left"><span class="presence" aria-hidden="true"></span><strong>Jarvis</strong></div>
    <div class="notch-space" aria-hidden="true"></div>
    <div class="crown-right"><div id="voice-mark" class="voice-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><button id="expand" aria-label="Ouvrir la conversation" title="Ouvrir Jarvis"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3h7v7M13 3 3 13"/></svg></button><button id="close" aria-label="Masquer" title="Masquer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8"/></svg></button></div>
  </header>
  <div class="content"><div class="status-line"><span id="state">À l’écoute</span><span class="activity-track" aria-hidden="true"><i></i></span></div><p id="response" tabindex="0" aria-live="polite" aria-label="Transcription et réponse complètes">Parlez naturellement.</p><footer class="bottom"><span id="detail">Votre voix reste sur ce Mac</span><button id="cancel" hidden><span aria-hidden="true">■</span> Arrêter</button></footer></div>
</section></body></html>
